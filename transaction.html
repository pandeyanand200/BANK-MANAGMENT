<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transactions</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-4">
        <h2 class="mb-4">Transactions</h2>
        <section class="card mb-4">
            <div class="card-body">
                <h3 class="h5">Deposit or withdraw</h3>
                <form id="transaction-form" class="row g-3">
                    <div class="col-md-4">
                        <label for="account-number" class="form-label">Account</label>
                        <select id="account-number" class="form-select" required>
                            <option value="">Select an account</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="transaction-type" class="form-label">Transaction type</label>
                        <select id="transaction-type" class="form-select" required>
                            <option value="Deposit">Deposit</option>
                            <option value="Withdrawal">Withdrawal</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="transaction-amount" class="form-label">Amount</label>
                        <input id="transaction-amount" class="form-control" type="number" min="0.01" step="0.01" required>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button class="btn btn-success w-100" type="submit">Submit</button>
                    </div>
                    <div class="col-12">
                        <p id="current-balance" class="mb-0" aria-live="polite">Select an account to see its balance.</p>
                        <p id="transaction-message" class="mb-0 mt-2" role="status" aria-live="polite"></p>
                    </div>
                </form>
            </div>
        </section>

        <h3 class="h5 mb-3">Transaction History</h3>
        <div class="table-responsive">
            <table class="table table-bordered table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Account Number</th>
                        <th>Type</th>
                        <th>Amount</th>
                        <th>Date</th>
                        <th>Balance After</th>
                    </tr>
                </thead>
                <tbody id="transaction-list"></tbody>
            </table>
        </div>
    </div>
    <script type="module" src="./js/transaction.js"></script>
</body>
</html>
